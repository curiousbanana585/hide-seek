<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sardines</title>
<meta name="description" content="Real-life hide and seek, sardines style. A Bouncy Production · Made for Haz.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --sea:#0b1f33;--sea2:#12304d;--road:#24476a;
  --tin:#c9d3dd;--tin2:#9aa8b6;--paper:#f3e6c8;--ink:#1d2a38;--label:#c0392b;
  --tomato:#e5533d;--tomInk:#2a0d07;--mustard:#f2b631;--musInk:#241800;--pink:#ff8a78;
  --fg:#fff;--dim:rgba(255,255,255,.75);--faint:rgba(255,255,255,.6);--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);
  --slab:'Alfa Slab One',Rockwell,'Roboto Slab',Georgia,serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sea);color:var(--fg)}
body{font:16px/1.4 var(--sans);min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
a{color:var(--mustard)}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.scr{flex:1;display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
.slab{font-family:var(--slab);font-weight:400}
.h1{font-family:var(--slab);font-size:30px;line-height:1.12;margin:0}
.h2{font-family:var(--slab);font-size:19px;margin:0;font-weight:400}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.small{font-size:13px}.tiny{font-size:12px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.credit{margin:6px 0 0;text-align:center;font-size:12px;color:var(--faint)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{min-height:52px;border-radius:16px;padding:0 18px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none}
.btn.big{width:100%;min-height:56px;font-family:var(--slab);font-weight:400;font-size:19px}
.b-mus{background:var(--mustard);color:var(--musInk)}
.b-tom{background:var(--tomato);color:var(--tomInk)}
.b-tin{background:var(--tin);color:var(--ink)}
.b-ink{background:var(--ink);color:var(--mustard)}
.b-out{border:2px solid var(--tin);color:var(--tin)}
.b-ghost{border:1px solid rgba(255,255,255,.28);color:#fff}
.b-sos{min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--tomato);color:var(--pink);font-weight:700;font-size:13px}
.btn:disabled,.qbtn:disabled{background:rgba(255,255,255,.06);color:rgba(255,255,255,.55);border:1px solid var(--line)}
.chip{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap}
.c-mus{background:var(--mustard);color:var(--musInk)}
.c-tin{background:var(--tin);color:var(--ink)}
.c-tom{background:var(--tomato);color:var(--tomInk)}
.c-soft{background:rgba(201,211,221,.18);color:#e6ecf1;font-weight:600}
.card{background:var(--card);border-radius:14px;padding:12px 14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--dim)}
.inp{height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);padding:0 14px;font-size:18px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--mustard);outline-offset:1px}

/* tin label look */
.label{background:var(--paper);color:var(--ink);border-radius:20px;padding:6px;box-shadow:0 0 0 4px var(--tin)}
.label>.in{border:2px solid var(--label);border-radius:15px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.label .kick{font-size:11px;font-weight:700;letter-spacing:.2em}
.paper{background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 12px}
.red{color:var(--label)}
.sid{display:block}

/* home */
.home-label{margin:18px 4px 6px;box-shadow:0 0 0 6px var(--tin),0 0 0 8px var(--ink);border-radius:26px;padding:10px}
.home-label>.in{border-width:3px;padding:16px 12px}
.home-title{font-family:var(--slab);font-size:50px;color:var(--label);margin:0;line-height:1.05;letter-spacing:1px}
.codebox{display:flex;align-items:center;height:56px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);padding:0 12px;gap:8px;min-width:0}
.codebox input{flex:1;min-width:0;height:44px;border:0;background:transparent;font-family:var(--slab);font-size:22px;letter-spacing:3px;text-transform:uppercase}
.codebox input:focus{outline:none}
.codebox:focus-within{outline:2px solid var(--mustard)}
.join-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:14px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* lobby */
.tinno{font-family:var(--slab);font-size:34px;letter-spacing:3px;color:var(--label);line-height:1.1}
.lobby-top{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:12px;align-items:center;text-align:left!important}
.label>.in.lobby-top{display:grid}
.qr{width:96px;height:96px;background:#fff;border-radius:8px;border:2px solid var(--ink);padding:3px}
.qr svg{width:100%;height:100%;display:block}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:48px;padding:0 12px;border-radius:12px;background:var(--card)}
.ava{width:34px;height:34px;border-radius:50%;background:var(--tin);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.ava.s{background:var(--mustard);color:var(--musInk)}
.pname{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings{display:flex;flex-direction:column;background:var(--card);border-radius:14px;padding:2px 4px}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:48px;padding:0 10px;font-size:15px;border-top:1px solid rgba(255,255,255,.08);text-align:left;width:100%}
.set:first-child{border-top:0}
.set b{color:#fff}.set .v{display:flex;align-items:center;gap:6px;font-weight:700}
.set .v svg{opacity:.7}

/* timers */
.bigclock{font-family:var(--slab);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.midclock{font-family:var(--slab);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.word{font-family:var(--slab);font-size:42px;letter-spacing:3px;color:var(--label);line-height:1.1;word-break:break-all}
.tincells{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tc{min-height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc.in{background:var(--tomato);color:var(--tomInk);font-weight:700}
.tc.out{border:1px dashed rgba(201,211,221,.55);color:rgba(255,255,255,.85)}
.qlist{display:flex;flex-direction:column;gap:6px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:40px;padding:0 12px;border-radius:12px;background:var(--card);font-size:14px}
.qrow .a{font-weight:700;color:var(--mustard)}

/* hunt */
.topbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qbtn{min-height:52px;border-radius:14px;background:var(--tin);color:var(--ink);font-size:15px;font-weight:600;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.qbtn small{font-weight:500;font-size:12px}
.qbtn.sq{grid-column:span 2;background:transparent;border:2px solid var(--mustard);color:var(--mustard)}
.qbtn.sq:disabled{border:1px solid var(--line);color:rgba(255,255,255,.55)}
.bubble{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.banner{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.4}
.banner svg{flex:none}
.bn-tin{background:var(--tin);color:var(--ink)}
.bn-mus{background:rgba(242,182,49,.16);border:1px solid rgba(242,182,49,.5)}
.bn-tom{background:var(--tomato);color:var(--tomInk)}
.bn-soft{background:var(--card)}

/* map */
.map{position:relative;height:300px;border-radius:18px;overflow:hidden;background:var(--sea2);border:3px solid var(--tin);touch-action:none;user-select:none;-webkit-user-select:none}
.map .tiles{position:absolute;inset:0}
.map .tiles img{position:absolute;width:256px;height:256px;filter:invert(1) hue-rotate(185deg) brightness(.85) saturate(.55) contrast(.9);pointer-events:none;user-select:none}
.map .tint{position:absolute;inset:0;background:rgba(11,31,51,.28);pointer-events:none}
.map svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map .mk{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.map .pin{width:28px;height:28px;border-radius:50%;background:var(--paper);color:var(--ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}
.map .me{width:18px;height:18px;border-radius:50%;background:var(--tin);border:4px solid rgba(201,211,221,.35);box-sizing:content-box}
.map .tag{position:absolute;transform:translate(14px,-50%);font-size:12px;font-weight:700;background:rgba(11,31,51,.88);padding:3px 7px;border-radius:8px;white-space:nowrap;pointer-events:none}
.map .tag.tom{background:var(--tomato);color:var(--tomInk)}
.map .attr{position:absolute;right:6px;bottom:4px;font-size:10px;color:rgba(255,255,255,.7);background:rgba(11,31,51,.6);padding:1px 4px;border-radius:4px;pointer-events:auto}
.map .attr a{color:inherit}
.map .zm{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.map .zm button{width:40px;height:40px;border-radius:10px;background:rgba(11,31,51,.88);color:#fff;font-size:22px;font-weight:700;border:1px solid var(--line)}
.map .nomap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px}
.legend{display:flex;flex-direction:column;gap:3px;font-size:13px;color:rgba(255,255,255,.85)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(5,12,20,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--sea);border-radius:22px 22px 0 0;border-top:3px solid var(--tin);padding:18px max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.sheet.full{min-height:100%;border-radius:0;border:0}
.opt{min-height:48px;text-align:left;padding:8px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);font-size:15px;width:100%}
.opt[aria-pressed=true]{border:2px solid var(--mustard);background:rgba(242,182,49,.14);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.2);font-size:14px}
.seg button[aria-pressed=true]{border:2px solid var(--mustard);background:rgba(242,182,49,.14);color:var(--mustard);font-weight:700}

/* overlays */
.toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:80;width:calc(100% - 24px);max-width:496px;border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.taunt-toast{background:var(--mustard);color:var(--musInk);display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:calc(100% - 24px)}
.taunt-toast .t{font-family:var(--slab);font-size:19px;line-height:1.25;word-break:break-word}
.squeaked{position:fixed;inset:0;z-index:90;background:var(--mustard);color:var(--musInk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.squeaked h1{font-family:var(--slab);font-size:64px;margin:0;line-height:1}
.sos-scr{background:#1a0b0a;margin:-14px -16px -12px;padding:24px 20px 16px;min-height:100vh;align-items:center;text-align:center}
.hold{position:relative;width:220px;height:220px;touch-action:none;-webkit-user-select:none;user-select:none}
.hold svg{position:absolute;inset:0}
.hold button{position:absolute;left:22px;top:22px;width:176px;height:176px;border-radius:50%;background:var(--tomato);color:var(--tomInk);font-family:var(--slab);font-size:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;-webkit-touch-callout:none}
.hold button span{font-family:var(--sans);font-size:14px;font-weight:700}
.rank{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:50px;padding:0 12px;border-radius:12px;background:var(--card)}
.rank .n{font-family:var(--slab);font-size:20px;color:var(--mustard)}
.rank .pts{display:flex;flex-direction:column;align-items:flex-end}
.rank .pts b{font-family:var(--slab);font-weight:400;font-size:18px;color:var(--mustard)}
.scrub{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center}
.scrub input{width:100%;accent-color:var(--tin)}
.play{width:48px;height:48px;border-radius:50%;background:var(--tin);color:var(--ink);display:flex;align-items:center;justify-content:center}
.awards{display:flex;flex-direction:column;gap:8px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.wob{animation:wob .25s linear infinite}
@media (prefers-reduced-motion:reduce){.wob,.spin{animation:none}}

/* narrow phones: keep at the end so it wins over base rules */
@media (max-width:370px){
  .h1{font-size:26px}.home-title{font-size:42px}.bigclock{font-size:60px}.word{font-size:34px}
  .tinno{font-size:28px}.lobby-top{grid-template-columns:minmax(0,1fr) 84px}.qr{width:84px;height:84px}
  .map{height:260px}.qbtn{font-size:14px}
}
</style>
</head>
<body>
<div id="app" aria-live="off"></div>
<div id="layer"></div>
<script src="sync-config.js" onerror="void 0"></script>
<script src="sid-messages.js" onerror="void 0"></script>

<script>
(() => {
  'use strict';
  /* =====================================================================
     SARDINES · real-life hide and seek. A Bouncy Production · Made for Haz
     One hides (the sardine), everyone else (the Cats) hunts with questions
     answered from both phones' GPS. Finders squeeze into the tin.
     Sync: Firebase Realtime Database over REST + server-sent events (address
     in sync-config.js). With no address it falls back to a same-device demo.
     ===================================================================== */
  const DB = String((window.SYNC_CONFIG && window.SYNC_CONFIG.databaseURL) || '').trim().replace(/\/+$/, '');
  const KEY = 'sardinesStore1';
  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';           // no I, L, O, 0 or 1
  const CODE_RE = /^[A-HJKMNP-Z2-9]{6}$/;
  const MIN = 60000;
  const SV = { '.sv': 'timestamp' };
  const DEF = { pack: 15, limit: 60, cool: 3, sqr: 150, lies: true, pick: 'random', zone: null };
  const OPTS = { pack: [5, 10, 15, 20, 30], limit: [30, 45, 60, 90], cool: [1, 2, 3, 5], sqr: [100, 150, 200], zoneR: [400, 800, 1500, 0] };
  const QUIET_MS = 3 * MIN;          // sardine's phone silent this long = "gone quiet"
  const TAUNT_MS = 10 * MIN;         // one regular taunt every 10 min (+1 per squeak that sounded)
  const WAIT_MS = 60000;             // a question unanswered this long gives the turn back
  const MOVED_M = 60, BACK_M = 40;   // "moved" alarm on/off distances
  const OUCH_M = 40;
  const WORDS = ['PICKLE', 'KIPPER', 'ANCHOVY', 'BRINE', 'OLIVE', 'LEMON', 'MUSTARD', 'PILCHARD', 'HERRING', 'CRACKER', 'BISCUIT', 'WALRUS', 'NOODLE', 'PUFFIN', 'TOASTIE', 'CRUMPET', 'WOMBAT', 'GHERKIN', 'TEAPOT', 'DUMPLING', 'PRAWN', 'TRUMPET', 'WAFFLE', 'SPROUT'];

  /* ---------- small helpers ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const left = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + pad(s % 60); };      // countdowns
  const gone = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + pad(s % 60); };     // elapsed
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const normCode = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const genCode = () => { let c = ''; const a = new Uint32Array(6); if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else a.forEach((_, i) => { a[i] = Math.random() * 4e9; }); for (let i = 0; i < 6; i++) c += CODE_CHARS[a[i] % CODE_CHARS.length]; return c; };

  const obj = (o) => (o && typeof o === 'object' ? o : {});

  /* ---------- storage (works with storage blocked) ---------- */
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  let store = load();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
  if (!store.pid) { store.pid = 'p' + rid(); save(); }
  const ME = store.pid;

  /* ---------- geometry ---------- */
  const R_EARTH = 6371000, rad = (d) => d * Math.PI / 180;
  function dist(a, b) {
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function offsetNE(a, b) {      // metres north / east from a to b
    return { n: rad(b.lat - a.lat) * R_EARTH, e: rad(b.lng - a.lng) * R_EARTH * Math.cos(rad((a.lat + b.lat) / 2)) };
  }

  }
  const fmtM = (m) => (m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.round(m / 10) * 10 + 'm');

  /* =====================================================================
     ENGINE (pure functions, no DOM) — exposed on window.__sardines for tests
     ===================================================================== */
  const QK = { hc: 'Hotter or colder?', w100: 'Within 100m?', w300: 'Within 300m?', ns: 'North or south?', ew: 'East or west?', sq: 'Squeak!' };
  const ANS = { hot: 'Hotter', cold: 'Colder', yes: 'Yes', no: 'No', n: 'North', s: 'South', e: 'East', w: 'West', close: 'Too close to call', void: 'No answer', sounded: 'Sounded', far: 'Too far' };
  const FLIP = { hot: 'cold', cold: 'hot', yes: 'no', no: 'yes', n: 's', s: 'n', e: 'w', w: 'e' };
  const isFix = (f) => !!f && typeof f.lat === 'number' && typeof f.lng === 'number' && isFinite(f.lat) && isFinite(f.lng);

  function catsOf(r) { return Object.keys(obj(r.cats)).filter((p) => p !== r.sardine); }
  function rinfo(r, now) {
    const huntAt = (r.startAt || 0) + (r.pack || 0) * MIN, endAt = huntAt + (r.limit || 0) * MIN;

      .map(([p, v]) => ({ p, at: v.at, lat: v.lat, lng: v.lng })).sort((a, b) => a.at - b.at);
    let done = false, why = null, doneAt = null;
    if (typeof r.startAt !== 'number') return { huntAt, endAt, cats, tin, done, why, doneAt, phase: 'wait' };
    if (r.sos && typeof r.sos.at === 'number') { done = true; why = 'sos'; doneAt = r.sos.at; }
    else if (cats.length && tin.length >= cats.length) { done = true; why = 'full'; doneAt = Math.max(huntAt, tin[tin.length - 1].at); }
    else if (now >= endAt) { done = true; why = 'time'; doneAt = endAt; }
    const phase = done ? 'done' : now < huntAt ? 'pack' : 'hunt';
    return { huntAt, endAt, cats, tin, done, why, doneAt, phase };
  }
  function questions(r) {
    return Object.entries(obj(r.q)).filter(([, v]) => v && typeof v === 'object' && typeof v.at === 'number' && typeof v.p === 'string' && QK[v.k])
      .map(([id, v]) => Object.assign({ id }, v)).sort((a, b) => a.at - b.at || (a.id < b.id ? -1 : 1));
  }

      const start = (e) => { if (e) e.preventDefault(); if (t0 || done) return; t0 = Date.now(); buzz(60); raf = requestAnimationFrame(step); };
      b.addEventListener('pointerdown', start);
      b.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
      b.addEventListener('keyup', reset);
      b.addEventListener('contextmenu', (e) => e.preventDefault());
      window.addEventListener('pointerup', reset); window.addEventListener('pointercancel', reset); window.addEventListener('blur', reset);
      return { destroy() { cancelAnimationFrame(raf); window.removeEventListener('pointerup', reset); window.removeEventListener('pointercancel', reset); window.removeEventListener('blur', reset); } };
    }, true);
  }
  function pickSheet() {
    const s = sets();
    openSheet('pick', `${back()}<h1 class="h1">Who’s the sardine?</h1><p class="dim small" style="margin:0">For the first round. After that, the last one in the tin hides next.</p>
      <div style="display:flex;flex-direction:column;gap:6px">${[{ p: 'random', name: 'Random (Sid picks)' }].concat(plist()).map((x) => `<button type="button" class="opt" data-act="pickset" data-p="${esc(x.p)}" aria-pressed="${s.pick === x.p}">${esc(x.name)}</button>`).join('')}</div>`);
  }
  function zoneSheet() {
    let r0 = (sets().zone && sets().zone.r) || 800;
    openSheet('zone', `${back()}<h1 class="h1">Play zone</h1><p class="dim small" style="margin:0">A circle centred where you’re standing now. Anyone who strays out gets a nudge, and everyone sees who’s out.</p>
      <div class="seg" id="zseg">${OPTS.zoneR.map((v) => `<button type="button" data-act="zpick" data-r="${v}" aria-pressed="false">${v ? fmtM(v) : 'Off'}</button>`).join('')}</div>
      <div id="zmap"></div><p class="small dim" style="margin:0" id="znote"></p>
      <button type="button" class="btn big b-mus" data-act="zsave">Save zone</button>`, () => {
      const map = makeMap($('#zmap', layer), 'Map preview of the play zone');
      const api = {
        get r() { return r0; }, setR(v) { r0 = v; api.update(); },
        update() {
          layer.querySelectorAll('#zseg button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.r === r0)));
          const items = [];
          if (geo.fix) { if (r0) items.push({ t: 'circle', lat: geo.fix.lat, lng: geo.fix.lng, r: r0, stroke: '#e5533d', dash: '10 8', fill: 'rgba(229,83,61,.08)' }); items.push({ t: 'pin', lat: geo.fix.lat, lng: geo.fix.lng, html: '<div class="me"></div>' }); }
          map.set(items);
          txt('znote', geo.fix ? (r0 ? `${fmtM(r0)} from here in every direction.` : 'No zone. Play anywhere.') : 'Waiting for your location…');
        },
        destroy() { map.destroy(); },
      };
      return api;
    });
  }

  /* ---------- pop-ups ---------- */
  let toastTimer = 0;
  function toast(html, cls, ms) {
    clearTimeout(toastTimer);
    let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); el.addEventListener('click', () => { el.remove(); }); }
    el.className = 'toast ' + (cls || 'bn-tin'); el.innerHTML = html;
    toastTimer = setTimeout(() => el.remove(), ms || 3500);
  }
  function showTaunt(name, text) {
    splat(); buzz([80, 60, 160]);
    toast(`${sid('taunt', 72)}<div><div class="tiny" style="font-weight:700;letter-spacing:.08em">${esc(name.toUpperCase())} SAYS</div><div class="t">${esc(text)}</div></div>`, 'taunt-toast', 7000);
  }
  function showSqueaked() {
    let el = $('#sqk'); if (el) el.remove();
    el = document.createElement('div'); el.id = 'sqk'; el.className = 'squeaked'; el.setAttribute('role', 'alert');
    el.innerHTML = `<div class="wob">${sid('shock', 220)}</div><h1>SQUEAK!</h1><b style="font-size:19px">${esc(nameOf(view.sqBy))} squeaked you.</b><p style="margin:0;max-width:320px">Your phone is shrieking and there’s no mute. Act natural. Blame the pigeons.</p><p class="small" style="margin:0">Tap to close</p>`;
    el.addEventListener('click', () => el.remove());
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }

  /* =====================================================================
     ACTIONS
     ===================================================================== */
  function myName() { const i = $('#nm'); const v = (i ? i.value : store.name || '').trim().slice(0, 16); if (!v) { const e = $('#err'); if (e) e.textContent = 'Pop your name in first.'; if (i) i.focus(); return null; } store.name = v; save(); return v; }
  function startRound(sardine) {
    const n = curN() + 1, s = sets(); if (T.rounds && T.rounds[n]) return;
    const cats = {}; plist().forEach((x) => { if (x.p !== sardine) cats[x.p] = 1; });
    relay.set('rounds/' + n, { sardine, word: pick(WORDS), startAt: SV, pack: s.pack, limit: s.limit, cool: s.cool, sqr: s.sqr, lies: !!s.lies, zone: s.zone && s.zone.r ? s.zone : null, cats });
    relay.patch('game', { round: n, over: false });
    view.replay = false; view.packMsg = null;
  }
  const ACT = {
    create() {
      const nm = myName(); if (!nm) return;
      const code = genCode(); store.tin = code; store.made = code; save();
      connect(code);
      relay.set('game', { v: 1, host: ME, created: SV, round: 0, over: false, set: Object.assign({}, DEF) });
      relay.set('players/' + ME, { name: nm, at: SV });
      try { history.replaceState(null, '', location.pathname + '?tin=' + code); } catch (e) {}
      refresh();
    },
    join() {
      const nm = myName(); if (!nm) return;
      const code = normCode($('#cd').value);
      if (!CODE_RE.test(code)) { $('#err').textContent = 'Tin numbers are 6 letters and numbers, like KQ7F2M.'; return; }
      store.tin = code; save(); connect(code);
      try { history.replaceState(null, '', location.pathname + '?tin=' + code); } catch (e) {}
      refresh();
    },
    leave() {
      if (relay && T && T.game && !curRound() && !G().over && hostId() !== ME) relay.del('players/' + ME);
      closeSheet(); disconnect(); unwake(); store.tin = null; store.made = null; save(); curKey = '';
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      refresh();
    },
    share() {
      const url = location.origin + location.pathname + '?tin=' + store.tin;
      if (navigator.share) navigator.share({ title: 'Sardines', text: `Join my tin: ${store.tin}`, url }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('<b>Link copied.</b> Send it to the Cats.'), () => toast('Tin number: <b>' + store.tin + '</b>'));
      else toast('Tin number: <b>' + store.tin + '</b>');
    },
    setting(el) {
      if (hostId() !== ME) return;
      const k = el.dataset.k, s = sets();
      if (k === 'pick') return pickSheet();
      if (k === 'zone') return zoneSheet();
      if (k === 'lies') return relay.patch('game/set', { lies: !s.lies });
      const o = OPTS[k], i = o.indexOf(s[k]);
      relay.patch('game/set', { [k]: o[(i + 1) % o.length] });
    },
    pickset(el) { relay.patch('game/set', { pick: el.dataset.p }); closeSheet(); },
    zpick(el) { if (sheetApi && sheetApi.setR) sheetApi.setR(+el.dataset.r); },
    zsave() {
      const r = sheetApi ? sheetApi.r : 0;
      if (r && !geo.fix) { toast('Waiting for your location first.'); return; }
      relay.patch('game/set', { zone: r ? { lat: geo.fix.lat, lng: geo.fix.lng, r } : null });
      closeSheet();
    },
    start() {
      if (hostId() !== ME || plist().length < 2) return;
      const s = sets(), ps = plist();
      startRound(s.pick !== 'random' && P()[s.pick] ? s.pick : pick(ps).p);
    },
    next() {
      const r = curRound(); if (!r || hostId() !== ME) return;
      if (plist().length < 2) { toast('Need at least 2 players.'); return; }
      let nx = nextSardine(r, P()); if (!P()[nx]) nx = pick(plist()).p;
      startRound(nx);
    },
    endgame() {
      if (Date.now() - view.endArm < 4000) { view.endArm = 0; relay.patch('game', { over: true }); return; }
      view.endArm = Date.now(); refresh(); setTimeout(refresh, 4100);
    },
    newgame() { if (hostId() !== ME) return; relay.del('rounds'); relay.patch('game', { round: 0, over: false }); view.replay = false; },
    replay() { view.replay = true; refresh(); },
    results() { view.replay = false; refresh(); },
    async ask(el) {
      const r = curRound(), k = el.dataset.k; if (!r) return;
      const ts = turnState(r, ME, now()); if (!ts.ready || quiet(r.sardine)) return;
      app.querySelectorAll('#qg .qbtn').forEach((b) => { b.disabled = true; });
      const f = await freshFix(15000);
      if (!f) { toast('No GPS fix yet. Try somewhere more open.'); refresh(); return; }
      const r2 = curRound(); if (!r2 || r2.startAt !== r.startAt || !turnState(r2, ME, now()).ready) { refresh(); return; }
      const id = rid();
      view.msgs[id] = say('wait');
      relay.set(rpath('q/' + id), { p: ME, k, lat: f.lat, lng: f.lng, acc: f.acc, at: SV });
      if (k === 'sq') view.msgs[id] = say('sq');
      refresh();
    },
    found() { foundSheet(); },
    async squeeze() {
      const r = curRound(), inp = $('#wd', layer); if (!r || !inp) return;
      if (normCode(inp.value) !== normCode(r.word)) { txt('werr', 'Nope. That’s not the word. No word, no tin.'); buzz(200); inp.select(); return; }
      const f = await freshFix(30000);
      relay.set(rpath('tin/' + ME), f ? { at: SV, lat: f.lat, lng: f.lng } : { at: SV });
      ding(); buzz([100, 60, 100]); closeSheet(); refresh();
    },
    fib() { fibSheet(); },
    fibpick(el) { view.fibTo = el.dataset.p; if (sheetApi && sheetApi.update) sheetApi.update(); },
    fibgo() {
      const r = curRound(); if (!r || !view.fibTo || obj(obj(r.fib)[ME]).to) { closeSheet(); return; }
      relay.set(rpath('fib/' + ME), { to: view.fibTo, at: SV });
      closeSheet(); toast(`Fib loaded. ${esc(nameOf(view.fibTo))}’s next answer comes out backwards.`);
    },
    taunt() { tauntSheet(); },
    tpick(el) { const o = sheetApi && sheetApi.opts; if (!o) return; view.tauntPick = o[+el.dataset.i]; const tw = $('#tw', layer); if (tw) tw.value = ''; txt('tlen', '0 / 80'); layer.querySelectorAll('#topts .opt').forEach((b) => b.setAttribute('aria-pressed', String(b === el))); },
    tsend() {
      const r = curRound(); if (!r) return;
      const ts = tauntState(r, ME, now()); if (!ts.can) { closeSheet(); return; }
      const own = ($('#tw', layer) || {}).value || '', text = (own.trim() || view.tauntPick || '').slice(0, 80);
      if (!text) return;
      relay.set(rpath('taunt/' + rid()), { text, at: SV, b: ts.regReady ? 0 : 1 });
      closeSheet(); toast('Taunt sent. Shameless.');
    },
    sos() { const r = curRound(); if (!r || r.sos) return; sosSheet(); },
    sosgo() {
      const r = curRound(); closeSheet(); if (!r || r.sos) return;
      const f = geo.fix;
      relay.set(rpath('sos'), Object.assign({ p: ME, at: SV }, f ? { lat: f.lat, lng: f.lng } : {}));
      buzz([300, 100, 300]);
    },
    sosok() { const r = curRound(); if (r && r.sos) relay.patch(rpath('sos'), { ok: 1 }); },
    closesheet(el, e) { if (e && el.classList.contains('sheet-wrap') && e.target !== el) return; closeSheet(); },
    sound() { audio(); setTimeout(refresh, 150); },
    geo() { geoStart(true); refresh(); },
  };
  function onAct(e) {
    const el = e.target.closest('[data-act]'); if (!el || !el.dataset.act) return;
    const a = ACT[el.dataset.act]; if (!a) return;
    if (el.disabled) return;
    a(el, e);
  }
  app.addEventListener('click', onAct);
  layer.addEventListener('click', onAct);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && view.sheet && view.sheet !== 'sos') closeSheet(); });
  document.addEventListener('pointerdown', () => { audio(); }, { capture: true, passive: true });

  /* =====================================================================
     HEARTBEAT
     ===================================================================== */
  let lastPres = 0, lastGeo = '';
  setInterval(() => {
    if (relay) {
      referee();
      if (Date.now() - lastPres > 20000 || geo.st !== lastGeo) { lastPres = Date.now(); lastGeo = geo.st; presence(); }
    }
    refresh();
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { lastPres = 0; if (relay) geoStart(); refresh(); } });

  if (store.tin && CODE_RE.test(store.tin)) connect(store.tin);
  else { store.tin = null; save(); }
  refresh();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

  window.__sardines = { engine: ENGINE, skew(ms) { skew = ms; refresh(); }, state: () => ({ T, key: curKey, me: ME, geo: geo.st, link, sheet: view.sheet }) };
})();
</script>
</body>
</html>
